AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Shared, one-time account setup for the mini-kanban-board deploy
  pipeline: the GitHub OIDC provider and the ECR repository both
  environments use. Applied by hand with the admin profile - see
  deploy/README.md. The per-environment deploy roles live in
  deploy-role.yaml.

Parameters:
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Set to "false" if token.actions.githubusercontent.com is already
      registered as an OIDC provider in this account (only one provider
      per URL is allowed per account).

Conditions:
  ShouldCreateOidcProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        # SHA1 fingerprints of token.actions.githubusercontent.com's CA
        # chain (root: ISRG Root X1; intermediate as served), fetched
        # live at authoring time via:
        #   openssl s_client -connect token.actions.githubusercontent.com:443 \
        #     -servername token.actions.githubusercontent.com -showcerts
        # AWS validates the provider's TLS chain directly rather than
        # relying on this list, but the field is required and non-empty.
        # Re-run the command above and update this list if GitHub Actions
        # OIDC sign-in ever starts failing after a GitHub CA rotation.
        - cabd2a79a1076a31f21d253635cb039d4329a5e8
        - 2d74d6dfd96eea55ad7baafa0d3c6552b2dadc37

  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: kanban
      # Shared by dev and prod: dev builds, prod runs the same images.
      # Immutable, so the dev role can't overwrite a tag prod runs.
      ImageTagMutability: IMMUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [{
              "rulePriority": 1,
              "description": "Keep only the last 30 images",
              "selection": {
                "tagStatus": "any",
                "countType": "imageCountMoreThan",
                "countNumber": 30
              },
              "action": { "type": "expire" }
            }]
          }

Outputs:
  EcrRepositoryUri:
    Description: Persistent ECR repository the deploy workflow pushes images to.
    Value: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${EcrRepository}
