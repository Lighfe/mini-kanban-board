AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Ephemeral per-run app stack for mini-kanban-board: EC2 (app + Caddy
  containers), RDS Postgres, and the security groups/secrets/parameter
  tying them together. Created and destroyed on every `deploy`/`destroy`
  run — see _docs/deployment-plan.md step 6. Deployed by the scoped role
  from deploy/cloudformation/bootstrap.yaml, never by hand with
  AdminAccess.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to launch the EC2 instance and RDS subnet group into.
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >
      Exactly two subnets in different AZs (RDS requires a subnet group
      spanning >=2 AZs even for a single-AZ instance). The EC2 instance
      launches into the first one.
  EcrRepositoryUri:
    Type: String
    Description: URI of the persistent ECR repo (bootstrap stack output), without a tag.
  ImageTag:
    Type: String
    Description: Image tag to run (the deploying commit's git SHA).
  SubdomainName:
    Type: String
    Default: katban-10x-cat-productivity.lighfe.dev
    Description: Public hostname Caddy requests a TLS cert for.
  AdminEmail:
    Type: String
    Default: juliandralle@gmail.com
    Description: Contact address for Let's Encrypt ACME registration.

Resources:
  Ec2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: kanban-app EC2 instance - inbound HTTPS/HTTP (ACME challenge)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Let's Encrypt HTTP-01 challenge

  RdsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: kanban-app RDS - inbound Postgres from the app instance only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref Ec2SecurityGroup
          Description: Postgres from the EC2 app instance

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: kanban-app RDS subnet group
      SubnetIds: !Ref SubnetIds

  DbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub kanban-app-${AWS::StackName}-db
      Description: Master password for the kanban-app RDS instance.
      GenerateSecretString:
        SecretStringTemplate: '{"username":"kanban"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\'

  DbInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    Properties:
      Engine: postgres
      EngineVersion: "17.6"
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: "20"
      StorageType: gp3
      MultiAZ: false
      PubliclyAccessible: false
      DBName: kanban
      MasterUsername: kanban
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DbSecret}:SecretString:password}}"
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - !Ref RdsSecurityGroup
      DeletionProtection: false
      BackupRetentionPeriod: 0

Outputs:
  DBSecretArn:
    Value: !Ref DbSecret
  DBEndpointAddress:
    Value: !GetAtt DbInstance.Endpoint.Address
