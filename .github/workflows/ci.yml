name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          working-directory: backend
      - name: Install dependencies
        working-directory: backend
        run: uv sync
      - name: Run pytest
        working-directory: backend
        run: uv run pytest

  # `bun run lint` is deliberately not gated here yet: it currently fails
  # on 38 pre-existing prettier/prettier errors in already-committed,
  # Lovable-managed frontend code (formatting only, no logic) across 9
  # files, and this repo doesn't edit frontend/ locally (see AGENTS.md).
  # Once Lovable reformats those files and the submodule pointer is
  # bumped, add a `bun run lint` step back here as a blocking check —
  # not `continue-on-error`, since a check that's red forever gets
  # ignored.
  frontend-test:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api
        run: bun run build

  e2e:
    name: End-to-end (Docker Compose + Playwright)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build and start the stack
        run: docker compose up --build -d

      - name: Wait for the app to become healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/api/health >/dev/null; then
              echo "App is up"
              exit 0
            fi
            sleep 2
          done
          echo "App did not become healthy in time" >&2
          docker compose logs
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm install

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8000
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down the stack
        if: always()
        run: docker compose down -v
