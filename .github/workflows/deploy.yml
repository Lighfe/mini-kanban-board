name: Deploy

# Manual only (not push-to-main): usage is short and infrequent, so an
# always-on auto-deploy doesn't fit. See _docs/deployment-plan.md step 6.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "deploy or destroy"
        required: true
        type: choice
        options: [deploy, destroy]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  STACK_NAME: kanban-app
  ECR_REPOSITORY: kanban
  SUBDOMAIN: katban-10x-cat-productivity.lighfe.dev

jobs:
  deploy:
    if: inputs.action == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve ECR repository URI
        id: ecr
        run: |
          uri=$(aws ecr describe-repositories --repository-names "${{ env.ECR_REPOSITORY }}" \
            --query "repositories[0].repositoryUri" --output text)
          echo "uri=$uri" >> "$GITHUB_OUTPUT"

      - name: Log in to ECR
        run: |
          aws ecr get-login-password --region "${{ env.AWS_REGION }}" | \
            docker login --username AWS --password-stdin "${{ steps.ecr.outputs.uri }}"

      - name: Build and push image
        run: |
          docker build -t "${{ steps.ecr.outputs.uri }}:${{ github.sha }}" .
          docker push "${{ steps.ecr.outputs.uri }}:${{ github.sha }}"

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file deploy/cloudformation/stack.yaml \
            --stack-name "${{ env.STACK_NAME }}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              VpcId="${{ vars.AWS_VPC_ID }}" \
              SubnetIds="${{ vars.AWS_SUBNET_IDS }}" \
              EcrRepositoryUri="${{ steps.ecr.outputs.uri }}" \
              ImageTag="${{ github.sha }}" \
              SubdomainName="${{ env.SUBDOMAIN }}"

      - name: Update DNS A record
        run: |
          ip=$(aws cloudformation describe-stacks --stack-name "${{ env.STACK_NAME }}" \
            --query "Stacks[0].Outputs[?OutputKey=='InstancePublicIp'].OutputValue" \
            --output text)
          cat > /tmp/change-batch.json <<JSON
          {
            "Changes": [{
              "Action": "UPSERT",
              "ResourceRecordSet": {
                "Name": "${{ env.SUBDOMAIN }}",
                "Type": "A",
                "TTL": 60,
                "ResourceRecords": [{"Value": "$ip"}]
              }
            }]
          }
          JSON
          aws route53 change-resource-record-sets \
            --hosted-zone-id "${{ vars.AWS_HOSTED_ZONE_ID }}" \
            --change-batch file:///tmp/change-batch.json

      - name: Wait for health check
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://${{ env.SUBDOMAIN }}/api/health" || true)
            if [ "$code" = "200" ]; then
              echo "Healthy"
              exit 0
            fi
            echo "Attempt $i: got $code, retrying in 10s"
            sleep 10
          done
          echo "App did not become healthy in time" >&2
          exit 1

  destroy:
    if: inputs.action == 'destroy'
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Delete DNS A record
        run: |
          ip=$(aws cloudformation describe-stacks --stack-name "${{ env.STACK_NAME }}" \
            --query "Stacks[0].Outputs[?OutputKey=='InstancePublicIp'].OutputValue" \
            --output text 2>/dev/null || true)
          if [ -n "$ip" ] && [ "$ip" != "None" ]; then
            cat > /tmp/change-batch.json <<JSON
          {
            "Changes": [{
              "Action": "DELETE",
              "ResourceRecordSet": {
                "Name": "${{ env.SUBDOMAIN }}",
                "Type": "A",
                "TTL": 60,
                "ResourceRecords": [{"Value": "$ip"}]
              }
            }]
          }
          JSON
            aws route53 change-resource-record-sets \
              --hosted-zone-id "${{ vars.AWS_HOSTED_ZONE_ID }}" \
              --change-batch file:///tmp/change-batch.json || true
          fi

      - name: Delete stack
        run: |
          aws cloudformation delete-stack --stack-name "${{ env.STACK_NAME }}"
          aws cloudformation wait stack-delete-complete --stack-name "${{ env.STACK_NAME }}"
