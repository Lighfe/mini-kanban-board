[project]
name = "jev"
version = "0.1.0"
description = "Delegate narrow decisions to Jev; see _docs/decision-delegation.md"
authors = [
    { name = "lighfe", email = "juliandralle@gmx.net" }
]
requires-python = ">=3.13"
dependencies = [
    "typesafe-sdk>=0.7.1",
]

[build-system]
requires = ["uv_build>=0.10.5,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
