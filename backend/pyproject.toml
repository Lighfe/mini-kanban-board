[project]
name = "kanban"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lighfe", email = "juliandralle@gmx.net" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
kanban = "kanban:main"

[build-system]
requires = ["uv_build>=0.10.5,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
